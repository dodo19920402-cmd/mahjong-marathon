<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b55">
  <title>麻將馬拉松｜輪班報名</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Noto Sans TC", sans-serif; color:#24312d; background:#f4f7f5; }
    * { box-sizing:border-box; }
    body { margin:0; }
    header { background:#176b55; color:white; padding:24px 16px; text-align:center; }
    header h1 { margin:0 0 8px; font-size:25px; }
    header p { margin:0; opacity:.9; }
    main { max-width:850px; margin:20px auto; padding:0 14px 40px; }
    .notice { background:white; border-radius:14px; padding:14px 16px; margin-bottom:16px; box-shadow:0 2px 10px #173d3010; }
    .status { font-size:14px; color:#52635c; min-height:22px; }
    .slot { background:white; border-radius:14px; margin:12px 0; padding:15px; box-shadow:0 2px 10px #173d3010; }
    .slot-head { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:12px; }
    .slot h2 { margin:0; font-size:17px; }
    .count { font-size:13px; color:#176b55; font-weight:700; white-space:nowrap; }
    .seats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; }
    button.seat { border:1px solid #d9e3de; border-radius:10px; background:#f8fbf9; padding:12px 10px; min-height:54px; text-align:left; color:#24312d; font:inherit; cursor:pointer; }
    button.seat.empty { border-style:dashed; color:#176b55; }
    button.seat.mine { background:#e7f5ef; border-color:#5ba98b; }
    button.seat:disabled { opacity:.65; cursor:wait; }
    .seat small { display:block; color:#64736d; font-size:12px; margin-top:3px; }
    .foot { color:#64736d; font-size:12px; line-height:1.6; margin-top:18px; }
    .overlay { position:fixed; inset:0; background:#0008; display:none; align-items:center; justify-content:center; padding:18px; }
    .dialog { background:white; width:min(100%,390px); border-radius:16px; padding:20px; }
    .dialog h3 { margin:0 0 12px; }
    input { width:100%; padding:12px; border:1px solid #cbd8d1; border-radius:9px; font:inherit; margin:8px 0 14px; }
    .actions { display:flex; gap:9px; }
    .actions button { flex:1; border:0; border-radius:9px; padding:12px; font:inherit; cursor:pointer; }
    .primary { background:#176b55; color:white; }
    .secondary { background:#edf2ef; color:#24312d; }
    @media (min-width:600px) { .seats { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  </style>
</head>
<body>
<header>
  <h1>🀄 麻將馬拉松</h1>
  <p>12/31 08:00 ～ 1/1 08:00｜每班 2 小時・每班 4 個名額</p>
</header>
<main>
  <section class="notice">
    <strong>選擇空位報名</strong>
    <div class="status" id="status">正在連線……</div>
  </section>
  <div id="schedule"></div>
  <p class="foot">報名後，請使用同一台裝置及瀏覽器管理自己的座位。清除瀏覽器資料或更換裝置，可能會失去原本的匿名身分，屆時請聯絡主辦人協助處理。</p>
</main>

<div class="overlay" id="overlay">
  <div class="dialog">
    <h3 id="dialogTitle">報名</h3>
    <label for="personName">請輸入姓名（最多 20 字）</label>
    <input id="personName" maxlength="20" autocomplete="name" placeholder="例如：小明">
    <div class="actions">
      <button class="secondary" id="cancelDialog">取消</button>
      <button class="primary" id="confirmDialog">確認報名</button>
    </div>
  </div>
</div>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="./firebase-config.js"></script>
<script>
(() => {
  const statusEl = document.getElementById('status');
  const scheduleEl = document.getElementById('schedule');
  const overlay = document.getElementById('overlay');
  const nameInput = document.getElementById('personName');
  const confirmBtn = document.getElementById('confirmDialog');
  const cancelBtn = document.getElementById('cancelDialog');
  const periods = [
    ['12/31 08:00','10:00'], ['12/31 10:00','12:00'],
    ['12/31 12:00','14:00'], ['12/31 14:00','16:00'],
    ['12/31 16:00','18:00'], ['12/31 18:00','20:00'],
    ['12/31 20:00','22:00'], ['12/31 22:00','1/1 00:00'],
    ['1/1 00:00','02:00'], ['1/1 02:00','04:00'],
    ['1/1 04:00','06:00'], ['1/1 06:00','08:00']
  ];
  let db, uid, pending = null, busy = false;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function render(data) {
    scheduleEl.innerHTML = periods.map((p,i) => {
      const slotId = `slot${String(i+1).padStart(2,'0')}`;
      const seats = data?.[slotId] || {};
      const taken = Object.keys(seats).filter(k => seats[k]);
      const cells = [1,2,3,4].map(n => {
        const seatId = `seat${n}`;
        const person = seats[seatId];
        const mine = person && person.uid === uid;
        if (!person) return `<button class="seat empty" data-slot="${slotId}" data-seat="${seatId}">＋ 空位 ${n}<small>點我報名</small></button>`;
        return `<button class="seat ${mine?'mine':''}" data-slot="${slotId}" data-seat="${seatId}" ${mine?'data-mine="1"':''}>${mine?'★ ':''}${esc(person.name)}<small>${mine?'點我取消':'已報名'}</small></button>`;
      }).join('');
      return `<section class="slot"><div class="slot-head"><h2>第 ${i+1} 班｜${p[0]}–${p[1]}</h2><span class="count">${taken.length}/4 人</span></div><div class="seats">${cells}</div></section>`;
    }).join('');
  }
  function showDialog(slot, seat) {
    pending = {slot, seat};
    document.getElementById('dialogTitle').textContent = '填寫報名姓名';
    nameInput.value = '';
    overlay.style.display = 'flex';
    nameInput.focus();
  }
  function hideDialog() { overlay.style.display = 'none'; pending = null; }
  scheduleEl.addEventListener('click', async e => {
    const btn = e.target.closest('button.seat');
    if (!btn || busy) return;
    const slot = btn.dataset.slot, seat = btn.dataset.seat;
    const ref = db.ref(`mahjong/slots/${slot}/${seat}`);
    if (btn.dataset.mine) {
      if (!confirm('確定要取消這個時段的報名嗎？')) return;
      busy = true; btn.disabled = true;
      try {
        const snap = await ref.get();
        if (snap.exists() && snap.val().uid === uid) await ref.remove();
        else alert('這個座位已經變更，請重新確認。');
      } catch(err) { alert('取消失敗：' + err.message); }
      finally { busy = false; }
    } else if (btn.classList.contains('empty')) showDialog(slot, seat);
  });
  cancelBtn.onclick = hideDialog;
  overlay.addEventListener('click', e => { if (e.target === overlay) hideDialog(); });
  confirmBtn.onclick = async () => {
    if (!pending || busy) return;
    const name = nameInput.value.trim();
    if (!name || name.length > 20) { alert('請輸入 1 至 20 個字的姓名。'); return; }
    const {slot,seat} = pending;
    busy = true; confirmBtn.disabled = true;
    try {
      const ref = db.ref(`mahjong/slots/${slot}/${seat}`);
      const result = await ref.transaction(current => current === null ? {uid, name, createdAt: Date.now()} : undefined);
      if (!result.committed) alert('不好意思，這個位置剛剛已被其他人報名，請選擇其他空位。');
      hideDialog();
    } catch(err) { alert('報名失敗：' + err.message); }
    finally { busy = false; confirmBtn.disabled = false; }
  };

 if (typeof firebaseConfig === 'undefined' || !firebaseConfig.apiKey || !firebaseConfig.databaseURL) {
    statusEl.textContent = '尚未填入 Firebase 設定，請先編輯 firebase-config.js。';
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    db = firebase.database();
    auth.onAuthStateChanged(async user => {
      try {
        if (!user) { await auth.signInAnonymously(); return; }
        uid = user.uid;
        statusEl.textContent = '已連線，報名狀況會自動同步更新。';
        db.ref('mahjong/slots').on('value', snap => render(snap.val() || {}), err => {
          statusEl.textContent = '讀取失敗：' + err.message;
        });
      } catch(err) { statusEl.textContent = '登入或連線失敗：' + err.message; }
    });
  } catch(err) {
    statusEl.textContent = 'Firebase 初始化失敗：' + err.message;
  }
})();
</script>
</body>
</html>
